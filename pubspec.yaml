name: time_capsule_new
description: "TimeCapsule - Transform your photos into emotional video collages with music."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  
  # Basic media handling
  image_picker: ^1.0.4
  
  # State management
  provider: ^6.0.5
  
  # Permissions
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/music/
    - assets/icons/ 